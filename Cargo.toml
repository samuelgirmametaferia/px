[package]
name = "px"
version = "3.0.0"
edition = "2024"
description = "px — the universal package-manager front-end for Linux (and beyond)"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "wrap_help", "suggestions"] }
clap_complete = "4"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
async-trait = "0.1"

# Serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UX
indicatif = "0.18"
dialoguer = "0.11"
console = "0.15"
owo-colors = "4"
comfy-table = "7"

# Matching
fuzzy-matcher = "0.3"
strsim = "0.11"

# System
which = "7"
dirs = "6"
regex = "1"
walkdir = "2"
sha2 = "0.10"
blake3 = "1"
ciborium = "0.2"
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "px"
path = "src/main.rs"

[lib]
name = "px"
path = "src/lib.rs"
