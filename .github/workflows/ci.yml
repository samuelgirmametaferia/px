# px CI: quality gates on every push and PR.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Installer regressions
        run: python3 scripts/test-installer.py
      - name: Tests
        run: cargo test
      - name: Recipes validate
        run: |
          for r in recipes/*.toml; do
            echo "checking $r"
          done
          # every bundled recipe must parse (px-registry check exercises the full path)
          cargo run --release --bin px-registry -- synth --count 10 --out /tmp/apps.jsonl
          cargo run --release --bin px-registry -- build --input /tmp/apps.jsonl --out /tmp/reg
          cargo run --release --bin px-registry -- check --registry /tmp/reg --query synth-app-0000001 | grep -q "synth-app-0000001"

  release-binary:
    # build the production binary on tags; attach happens in the release job
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (stripped)
        run: |
          cargo build --release --bin px
          strip target/release/px
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: px-linux-x86_64
          path: target/release/px
