# px upstream registry: scheduled discovery + build + publish.
# Free-tier architecture: Actions scan, Releases distribute, Attestations sign.
name: registry
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h, off the hour
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  discover-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tooling
        run: cargo build --release --bin px-registry

      # 1. unresolved-search-driven discovery: real px demand first
      - name: Pull unresolved queries (demand-driven discovery)
        run: |
          curl -sf "$REPORTS_ENDPOINT/v1/unresolved" -H "Authorization: Bearer $REPORTS_TOKEN" \
            -o unresolved.json || echo '[]' > unresolved.json

      # 2. scan for new candidates: installer patterns in fresh repos
      - name: Discover candidates
        run: |
          ./scripts/registry-discover.sh > candidates.jsonl || true
          ./scripts/registry-deduplicate.sh candidates.jsonl unresolved.json > todo.jsonl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2b. publish the candidate list to the `candidates` branch so
      #     `px registry candidates` (and humans) can inspect what discovery
      #     found — committed, not lost in CI logs
      - name: Publish candidate list
        run: |
          if [ -s candidates.jsonl ]; then
            git config user.name "px-registry-bot"
            git config user.email "actions@github.com"
            git checkout --orphan candidates || git checkout candidates
            git rm -rf --quiet . || true
            cp "$GITHUB_WORKSPACE/candidates.jsonl" . 2>/dev/null || true
            date -u +%FT%TZ > .last-discovery
            git add candidates.jsonl .last-discovery
            git commit -qm "discovery candidates $(date -u +%FT%TZ)" || true
            git push -q origin HEAD:candidates -f
          else
            echo "no candidates found this run"
          fi

      # 3. validate candidates in the disposable sandbox job
      - name: Validate (container sandbox, no secrets, timeouts)
        run: ./scripts/registry-validate.sh todo.jsonl validated.jsonl

      # 4. incremental build: only changed shards are rebuilt
      - name: Build changed shards
        run: |
          ./target/release/px-registry build \
            --input <(cat registry-seed.jsonl validated.jsonl | sort -u) \
            --out registry-out

      # 5. publish immutable blobs + attested root
      - name: Publish
        run: ./scripts/registry-publish.sh registry-out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
